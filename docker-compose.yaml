services:

  riak:
    build:
      context: services/openriak
    ports:
      - "8098:8098"
      - "8087:8087"
    networks:
      - riak-net
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  python-demo:
    build:
      context: services/python-demo
    networks:
      - riak-net
    environment:
      - RIAK_HOST=riak
      - RIAK_PORT=8098
    depends_on:
      riak:
        condition: service_healthy

  curl-demo:
    build:
      context: services/curl-demo
    networks:
      - riak-net
    environment:
      - RIAK_HOST=riak
      - RIAK_PORT=8098
    depends_on:
      riak:
        condition: service_healthy

  demo-done:
    image: alpine:3.21
    networks:
      - riak-net
    depends_on:
      python-demo:
        condition: service_completed_successfully
      curl-demo:
        condition: service_completed_successfully
    command: ["echo", "All demos finished."]

networks:
  riak-net:
    driver: bridge
