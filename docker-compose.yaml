services:

  openriak:
    build:
      context: services/openriak
    ports:
      - "8098:8098"
      - "8087:8087"
    networks:
      - openriak-net
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  python-demo:
    build:
      context: services/python-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  curl-demo:
    build:
      context: services/curl-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  java-demo:
    build:
      context: services/java-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  rust-demo:
    build:
      context: services/rust-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  typescript-demo:
    build:
      context: services/typescript-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  elixir-demo:
    build:
      context: services/elixir-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  gleam-demo:
    build:
      context: services/gleam-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  erlang-demo:
    build:
      context: services/erlang-demo
    networks:
      - openriak-net
    environment:
      - RIAK_HOST=openriak
      - RIAK_PORT=8098
    depends_on:
      openriak:
        condition: service_healthy

  demo-done:
    image: alpine:3.21
    networks:
      - openriak-net
    depends_on:
      openriak:
        condition: service_healthy
      python-demo:
        condition: service_completed_successfully
      curl-demo:
        condition: service_completed_successfully
      java-demo:
        condition: service_completed_successfully
      rust-demo:
        condition: service_completed_successfully
      typescript-demo:
        condition: service_completed_successfully
      elixir-demo:
        condition: service_completed_successfully
      gleam-demo:
        condition: service_completed_successfully
      erlang-demo:
        condition: service_completed_successfully

networks:
  openriak-net:
    driver: bridge
