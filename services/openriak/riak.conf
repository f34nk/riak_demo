## Node identity
nodename = riak@127.0.0.1
distributed_cookie = riak

## HTTP API
listener.http.internal = 0.0.0.0:8098

## Protocol Buffers
listener.protobuf.internal = 0.0.0.0:8087

## Handoff
handoff.ip = 0.0.0.0
handoff.port = 8099

## Ring - small size for single-node demo startup speed
ring_size = 8

## Storage backend (leveled required for Query API / secondary indexes)
storage_backend = leveled

## Paths
platform_data_dir = /var/lib/riak
platform_log_dir  = /var/log/riak

## Logging
logger.level = info
