[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riak-python-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openriak @ file:///{root}/generated/client/python-client-codegen",
    "smithy-core",
    "smithy-http[aiohttp]",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
